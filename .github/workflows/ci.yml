name: AlphaFlow S-Tier CI Pipeline

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Typecheck, ML Leakage & Agent Evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Python ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: ESLint Code Quality
        run: npm run lint

      - name: Run Vitest Unit, Quant & Agent Eval Suite
        run: npm run test

      - name: Verify Python Feature Store & Zero-Leakage Pipeline
        run: python ml/run_pipeline.py

      - name: Vite Production Bundle Build
        run: npm run build
